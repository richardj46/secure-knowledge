[project]
name = "secure-knowledge-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "email-validator>=2.3.0",
  "boto3>=1.43.49",
  "pypdf>=6.14.2",
  "google-genai>=1.0.0",
  "pgvector>=0.5.0",
  "tiktoken>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_knowledge_core"]
