[project]
name = "secure-knowledge-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.6.3",
  "redis>=5.2",
  "secure-knowledge-core",
]

[tool.uv.sources]
secure-knowledge-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_knowledge_worker"]
