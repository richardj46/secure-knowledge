[project]
name = "secure-knowledge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "secure-knowledge-core",
  "pyjwt[crypto]>=2.13.0",
  "pwdlib[argon2]>=0.3.0",
  "python-multipart>=0.0.32",
  "celery[redis]>=5.6.3",
]

[tool.uv.sources]
secure-knowledge-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_knowledge_api"]
