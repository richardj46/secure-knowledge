[project]
name = "secure-knowledge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "secure-knowledge"
]

[tool.uv.sources]
secure-knowledge = { path = "../../packages/secure_knowledge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
